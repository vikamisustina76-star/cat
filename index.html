<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мысли твоего кота 🐱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-bar">
        <div class="counter">💖 Уровень любви: <span id="score">0</span></div>
        <div class="hint">Погладь котика</div>
    </div>

    <div class="game-container" id="pet-area">
        <div class="thought-bubble" id="bubble">
            Мурр? Нажми на меня, Лиза...
        </div>

        <div class="cat-wrapper">
            <svg xmlns="http://w3.org" viewBox="0 0 100 100" width="100%" height="100%">
                <defs>
                    <linearGradient id="catGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#f3efff"/>
                        <stop offset="100%" stop-color="#cfc7ec"/>
                    </linearGradient>
                    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="100%" stop-color="#f5f2ff"/>
                    </linearGradient>
                </defs>
                <path d="M75,70 Q88,68 85,50 Q82,35 88,32 Q92,30 90,38 Q85,55 74,62" fill="#c1b9db" />
                <ellipse cx="70" cy="76" rx="9" ry="7" fill="#baaed6" />
                <ellipse cx="48" cy="64" rx="29" ry="21" fill="url(#catGrad)" />
                <ellipse cx="44" cy="67" rx="19" ry="13" fill="url(#bellyGrad)" />
                <ellipse cx="32" cy="80" rx="6" ry="5" fill="#c1b9db" />
                <ellipse cx="46" cy="80" rx="6" ry="5" fill="#c1b9db" />
                <g class="ear-l">
                    <polygon points="23,34 18,14 36,26" fill="#c1b9db" />
                    <polygon points="25,31 21,19 33,25" fill="#ffb6c1" />
                </g>
                <g class="ear-r">
                    <polygon points="53,26 71,14 66,34" fill="#c1b9db" />
                    <polygon points="56,25 68,19 64,31" fill="#ffb6c1" />
                </g>
                <circle cx="44" cy="39" r="17" fill="url(#catGrad)" />
                <circle cx="31" cy="44" r="3" fill="#ffb6c1" opacity="0.6"/>
                <circle cx="57" cy="44" r="3" fill="#ffb6c1" opacity="0.6"/>
                <circle class="eye eye-left" cx="37" cy="38" r="2" fill="#3a2a3a" />
                <circle class="eye eye-right" cx="51" cy="38" r="2" fill="#3a2a3a" />
                <circle class="eye eye-left" cx="36.5" cy="37" r="0.7" fill="#fff" />
                <circle class="eye eye-right" cx="50.5" cy="37" r="0.7" fill="#fff" />
                <polygon points="43,42 45,42 44,43.5" fill="#ff9ebb" />
                <path d="M41,45 Q44,47 44,45 Q44,47 47,45" fill="none" stroke="#3a2a3a" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
        </div>
    </div>

    <div class="author-watermark">создал:@Blooody11</div>

    <script src="script.js"></script>
</body>
</html>
